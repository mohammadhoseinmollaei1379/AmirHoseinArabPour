<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
    <style>
        ul {
            list-style-type: none; /*برای تنظیم آیکون*/
        }
    </style>
</head>
<body>
    
    <ol type="A">
        <li>amir</li>
        <li>amir</li>
        <li>amir</li>
    </ol>
    <ol type="1">
        <li>amir</li>
        <li>amir</li>
        <li>amir</li>
        <!-- li*10>{test} -->
    </ol>

    <ul>
        <li>text</li>
        <li>text</li>
        <li>text</li>
    </ul>

    <dl>
        <dt>amirhossein</dt>
        <dd>arabpour</dd>
    </dl>
</body>
</html>
