<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
    <style>
        table{
            border: 1px solid red;
        }
        td{
            border: 1px solid green;
        } /*برای رنگ دهی و معلوم شدن جدول*/
    </style>
</head>
<body>
    
    <table>
        <tr>
            <td colspan="2">
                milad
            </td>
            <td rowspan="3">
                hossein
            </td>
        </tr>
        <tr>
            <td>
                milad
            </td>
            <td>
                hossein
            </td>
        </tr>
        <tr>
            <td>
                milad
            </td>
            <td>
                hossein
            </td>
        </tr>
    </table>

</body>
</html>
